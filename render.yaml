services:
  - type: web
    name: pesaflow-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input
    startCommand: python manage.py migrate && python manage.py ensure_admin && python manage.py seed_demo_data && gunicorn pesaflow.wsgi:application
    healthCheckPath: /api/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pesaflow-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "localhost,127.0.0.1"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://pesaflow-frontend.vercel.app"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://pesaflow-frontend.vercel.app"
      - key: MPESA_ENVIRONMENT
        value: "sandbox"
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_CALLBACK_URL
        value: "https://pesaflow-backend-wdbv.onrender.com/api/payments/callback/"
      - key: MPESA_INITIATOR_NAME
        sync: false
      - key: MPESA_SECURITY_CREDENTIAL
        sync: false
      - key: MPESA_RESULT_URL
        value: "https://pesaflow-backend-wdbv.onrender.com/api/payments/withdrawal-callback/"
      - key: MPESA_TIMEOUT_URL
        value: "https://pesaflow-backend-wdbv.onrender.com/api/payments/withdrawal-callback/"
      - key: ADMIN_EMAIL
        value: "admin@gmail.com"
      - key: ADMIN_PHONE
        value: "0723274962"
      - key: ADMIN_FULL_NAME
        value: "Myles Munroe"
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: pesaflow-db
    plan: free
