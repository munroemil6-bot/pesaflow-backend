services:
  - type: web
    name: pesaflow-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input
    startCommand: python manage.py migrate && gunicorn pesaflow.wsgi:application
    healthCheckPath: /api/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pesaflow-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "localhost,127.0.0.1"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://pesaflow-frontend.vercel.app"
      - key: MPESA_ENVIRONMENT
        value: "sandbox"

databases:
  - name: pesaflow-db
    plan: free
